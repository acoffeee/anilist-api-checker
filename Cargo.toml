[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8"
reqwest = { version = "0.13.5", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.151"
subtle = "2.6.1"
tokio = {version = "1.53.2", features = ["rt-multi-thread"]}
tokio-rusqlite = "0.8.0"
dotenv = "0.15.0"
aws-config = "1.12.0"
aws-sdk-lambda = "1.149.0"
[[bin]]
name = "server"
path = "src/main.rs"
